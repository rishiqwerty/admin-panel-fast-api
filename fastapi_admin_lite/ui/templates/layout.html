<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default("FastAPI Admin") }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --bg-surface: #f1f5f9;
            --bg-header: #f8fafc;
            --bg-sidebar: #0f172a;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --sidebar-text: #94a3b8;
            --sidebar-text-active: #ffffff;
            --border: #e2e8f0;
            --sidebar-hover: #1e293b;
            --sidebar-active: #334155;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --sidebar-width: 240px;
            --topbar-height: 48px;

            /* Status Colors */
            --success-bg: #dcfce7;
            --success-text: #166534;
            --warning-bg: #fef9c3;
            --warning-text: #854d0e;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
            --info-bg: #e0f2fe;
            --info-text: #075985;
        }

        [data-theme="dark"] {
            --bg-main: #020617;
            --bg-card: #0f172a;
            --bg-surface: #1e293b;
            --bg-header: #1e293b;
            --bg-sidebar: #020617;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border: #1e293b;
            --sidebar-hover: #0f172a;
            --sidebar-active: #1e293b;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);

            /* Status Colors - Dark Mode */
            --success-bg: rgba(22, 101, 52, 0.2);
            --success-text: #4ade80;
            --warning-bg: rgba(133, 77, 14, 0.2);
            --warning-text: #facc15;
            --error-bg: rgba(153, 27, 27, 0.2);
            --error-text: #f87171;
            --info-bg: rgba(7, 89, 133, 0.2);
            --info-text: #38bdf8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background-color: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--sidebar-text-active);
        }

        .logo-subtext {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--sidebar-text);
            margin-top: -2px;
        }

        .nav-links {
            padding: 12px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-decoration: none;
            color: var(--sidebar-text);
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .nav-item:hover {
            background-color: var(--sidebar-hover);
            color: var(--sidebar-text-active);
        }

        .nav-item.active {
            background-color: var(--sidebar-active);
            color: var(--sidebar-text-active);
        }

        .sidebar-footer {
            padding: 24px;
            border-top: 1px solid var(--border);
            margin-top: auto;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            background-color: #e2e8f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .user-info .name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--sidebar-text-active);
        }

        .user-info .email {
            font-size: 0.75rem;
            color: var(--sidebar-text);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
        }

        /* Topbar */
        .topbar {
            height: var(--topbar-height);
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 36px;
            background-color: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: none;
            font-size: 0.85rem;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .search-box i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Page Content */
        .page-container {
            padding: 16px 24px;
            max-width: 100%;
            width: 100%;
        }

        .page-header {
            margin-bottom: 32px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .page-subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Shared Components */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-secondary {
            background-color: var(--bg-card);
            border-color: var(--border);
            color: var(--text-main);
        }

        .btn-secondary:hover {
            background-color: var(--bg-surface);
        }

        /* Extra CSS from child templates */
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">
                <i class="fas fa-database"></i>
            </div>
            <div>
                <div class="logo-text">FastAPI Admin</div>
                <div class="logo-subtext">Management Console</div>
            </div>
        </div>

        <div class="nav-links">
            <a href="/admin" class="nav-item {% if active_nav == 'dashboard' %}active{% endif %}">
                <i class="fas fa-th-large"></i>
                Dashboard
            </a>
            
            <div style="margin: 16px 16px 8px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.05em;">
                Resources
            </div>

            {% for m in models %}
            <a href="/admin/{{ m }}" class="nav-item {% if active_nav == m %}active{% endif %}">
                <i class="fas {% if m == 'user' or m == 'users' %}fa-user-group{% elif m == 'product' or m == 'products' %}fa-box{% else %}fa-database{% endif %}"></i>
                {{ m|capitalize }}
            </a>
            {% endfor %}

        </div>

        <div class="sidebar-footer">
            <div class="user-profile">
                <div class="avatar">
                    <img src="https://ui-avatars.com/api/?name=Admin+User&background=0D8ABC&color=fff" alt="Avatar">
                </div>
                <div class="user-info">
                    <div class="name">Admin User</div>
                    <div class="email">admin@fastapi.local</div>
                </div>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="topbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search resources...">
            </div>
            <div class="topbar-actions">
                <button id="theme-toggle" class="btn-icon" style="background: none; border: none; cursor: pointer; color: var(--text-muted);">
                    <i class="fas fa-moon"></i>
                </button>
                <i class="far fa-bell"></i>
                <i class="far fa-question-circle"></i>
                <div class="avatar" style="width: 32px; height: 32px;">
                    <img src="https://ui-avatars.com/api/?name=AU&background=0D8ABC&color=fff" alt="AU">
                </div>
            </div>
        </div>

        <div class="page-container">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script>
        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const icon = themeToggle.querySelector('i');
        
        // Check for saved theme or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateIcon(newTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
